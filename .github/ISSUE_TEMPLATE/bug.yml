name: Bug report
description: Report behavior that does not work as expected.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Include enough detail for someone else
        to reproduce and verify the fix.

  - type: dropdown
    id: human-validation
    attributes:
      label: ¿Requiere validación humana?
      description: CI debe ejecutarse siempre. Marca Sí si una persona debe comprobar el resultado.
      options:
        - Sí
        - No
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
      placeholder: The timer resets when...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence of steps that shows the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen instead.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or additional context
      description: Add console output, screenshots, browser details, or other useful context.
    validations:
      required: false
