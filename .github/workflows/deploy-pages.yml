name: Deploy Pages artifact

on:
  workflow_call:
    inputs:
      artifact_run_id:
        description: ID of the CI run that uploaded the dist artifact
        required: true
        type: string
      environment_name:
        description: GitHub environment that governs this deployment
        required: true
        type: string
    outputs:
      page_url:
        description: URL of the deployed GitHub Pages site
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publish GitHub Pages artifact
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
