name: Deploy to GitHub Pages
run-name: Deploy (${{ github.event_name }})

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of the successful CI run whose "dist" artifact will be deployed'
        required: true
        type: string

permissions:
  actions: read # required to download an artifact from another run (the CI run)
  contents: read
  pages: write
  id-token: write

# Do NOT cancel in-progress deployments: interrupting one halfway through could
# leave Pages in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    # Manual: always. Automatic: only when the triggering CI run succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # The `github-pages` environment can have a required reviewer (Phase 0.5 · [D6]):
    # Settings → Environments → github-pages → Required reviewers.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
