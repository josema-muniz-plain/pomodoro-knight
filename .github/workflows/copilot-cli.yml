name: Copilot Coding Agent CLI
run-name: Copilot Coding Agent CLI (${{ github.event_name }})

# V1: manually run the repository's coding agent through Copilot CLI. This
# first iteration has read-only repository permissions and does not persist
# changes made in the runner.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the coding agent
        required: true
        type: string

permissions:
  contents: read

jobs:
  coding-agent:
    name: Run coding agent
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Run coding agent
        # The agent may edit the temporary checkout and run npm validation, but
        # it cannot use Git or destructive shell commands. A later workflow
        # step—not the agent—will own commits and PR creation.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TASK: ${{ inputs.task }}
        run: |
          copilot -p "$TASK" \
            --agent=coding-agent \
            --model gpt-6-luna \
            --no-ask-user \
            --disallow-temp-dir \
            --secret-env-vars COPILOT_GITHUB_TOKEN \
            --allow-tool 'write' \
            --allow-tool 'shell(npm:*)' \
            --deny-tool 'shell(git:*)' \
            --deny-tool 'shell(rm)' \
            --deny-tool 'write(.env)'
