name: (v1) Copilot Coding Agent CLI
run-name: (v1) Copilot Coding Agent CLI (${{ github.event_name }})

# V1: manually run the repository's coding agent through Copilot CLI. After
# independent validation, the workflow—not the agent—publishes allowed changes
# in a dedicated branch and reviewable pull request.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Complete natural-language task for the coding agent (not an issue number)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  coding-agent:
    name: Run coding agent
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Always start from the PR base so the generated branch contains only
          # this run's changes, even if the workflow is manually selected from
          # a different branch.
          ref: ${{ github.event.repository.default_branch }}
          # Keep the workflow token out of the checkout while Copilot runs.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Run coding agent
        # The agent may edit the temporary checkout and run npm validation, but
        # it cannot use Git or destructive shell commands. A later workflow
        # step—not the agent—will own commits and PR creation.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TASK: ${{ inputs.task }}
        run: |
          copilot -p "$TASK" \
            --agent=coding-agent \
            --model gpt-6-luna \
            --no-ask-user \
            --disable-builtin-mcps \
            --disallow-temp-dir \
            --secret-env-vars COPILOT_GITHUB_TOKEN \
            --allow-tool 'write' \
            --allow-tool 'shell(npm:*)' \
            --deny-tool 'shell(git:*)' \
            --deny-tool 'shell(rm)' \
            --deny-tool 'write(.env)'

      - name: Verify agent change scope
        run: |
          changed_files=$( {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)

          if [ -z "$changed_files" ]; then
            exit 0
          fi

          unexpected_files=$(printf '%s\n' "$changed_files" | grep -Ev '^(src|test|scripts)/' || true)
          if [ -n "$unexpected_files" ]; then
            echo "The agent changed files outside its allowed scope:" >&2
            printf '%s\n' "$unexpected_files" >&2
            exit 1
          fi

      - name: Validate agent changes
        run: |
          npm run test:run
          npm run lint
          npm run build
          npm run validate:sprites

      - name: Create reviewable pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
          BRANCH: copilot/run-${{ github.run_id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          changed_files=$( {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)

          if [ -z "$changed_files" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No changes to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          unexpected_files=$(printf '%s\n' "$changed_files" | grep -Ev '^(src|test|scripts)/' || true)
          if [ -n "$unexpected_files" ]; then
            echo "The agent changed files outside its allowed scope:" >&2
            printf '%s\n' "$unexpected_files" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add --all
          git commit --message "feat: apply coding-agent changes"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$BRANCH"

          body_file=$(mktemp)
          {
            echo "## Coding-agent change"
            echo
            echo "Generated by workflow run ${GITHUB_RUN_ID}."
            echo
            echo "### Requested task"
            echo
            echo "$TASK"
          } > "$body_file"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "feat: coding-agent run ${GITHUB_RUN_ID}" \
            --body-file "$body_file"

          rm "$body_file"
          echo "created=true" >> "$GITHUB_OUTPUT"
