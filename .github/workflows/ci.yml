name: CI

# Fase 0.5: jobs separados lint / test / validate-sprites, y build al final
# con `needs`; matrix de Node en test, concurrency, output de validate-sprites
# y artifact de dist. Pendiente: $GITHUB_STEP_SUMMARY y caché de npm.
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main] # PR target branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:run

  # Este script solo usa módulos node:* (sin dependencias): no hace falta npm ci.
  validate-sprites:
    runs-on: ubuntu-latest
    outputs:
      sprite-count: ${{ steps.count.outputs.sprites }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:sprites
      - id: count
        run: echo "sprites=$(ls sprites/*.txt | wc -l)" >> "$GITHUB_OUTPUT"

  # La puerta final: solo arranca si lint, test y validate-sprites pasaron.
  build:
    needs: [lint, test, validate-sprites]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: 'echo "Sprites validados: ${{ needs.validate-sprites.outputs.sprite-count }}"'
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
