name: CI

# CI base de la Fase 0: lint + test + validate:sprites + build.
# Las mejoras de la Fase 0.5 (permissions, jobs/needs, matrix, concurrency,
# outputs, artifact, $GITHUB_STEP_SUMMARY, caché de npm...) se añaden a mano.
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run validate:sprites
      - run: npm run build
