name: CI

# Fase 0.5: jobs separados lint / test / validate-sprites, y build al final
# con `needs`. Pendiente: matrix, concurrency, outputs, artifact,
# $GITHUB_STEP_SUMMARY y caché de npm.
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main] # PR target branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  test:
    strategy:
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:run

  # Este script solo usa módulos node:* (sin dependencias): no hace falta npm ci.
  validate-sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:sprites

  # La puerta final: solo arranca si lint, test y validate-sprites pasaron.
  build:
    needs: [lint, test, validate-sprites]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
