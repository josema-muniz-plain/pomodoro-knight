name: CI
run-name: CI (${{ github.event_name }})

# Phase 0.5: separate lint, test, validate-sprites, and final build jobs using
# `needs`; test Node matrix, concurrency, validate-sprites output, dist artifact,
# summary, and npm cache.
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main] # PR target branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Run context in the summary: useful for debugging who/what triggered it.
  context:
    name: Run context
    runs-on: ubuntu-latest
    steps:
      - name: Run context
        run: |
          {
            echo "## Run context"
            echo
            echo "| Context | Value |"
            echo "|---|---|"
            echo "| event_name | \`${{ github.event_name }}\` |"
            echo "| ref | \`${{ github.ref }}\` |"
            echo "| ref_name | \`${{ github.ref_name }}\` |"
            echo "| head_ref | \`${{ github.head_ref }}\` |"
            echo "| base_ref | \`${{ github.base_ref }}\` |"
            echo "| sha | \`${{ github.sha }}\` |"
            echo "| actor | \`${{ github.actor }}\` |"
            echo "| run_id | \`${{ github.run_id }}\` |"
            echo "| run_attempt | \`${{ github.run_attempt }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      # `contains()` identifies runs triggered by code changes, as opposed to
      # manual (`workflow_dispatch`) runs.
      - name: Identify code-change trigger
        if: ${{ contains(fromJSON('["push", "pull_request"]'), github.event_name) }}
        run: echo "This run was triggered by a code change." >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:run

  # This script only uses node:* modules (no dependencies), so npm ci is unnecessary.
  validate-sprites:
    name: Validate ASCII sprites
    runs-on: ubuntu-latest
    outputs:
      sprite-count: ${{ steps.count.outputs.sprites }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:sprites
      - id: count
        run: echo "sprites=$(ls sprites/*.txt | wc -l)" >> "$GITHUB_OUTPUT"
      # `always()` preserves the summary even if the preceding validator fails.
      - name: Sprite summary
        if: ${{ always() }}
        run: |
          {
            echo "## Validated sprites"
            echo
            echo "| File | Level | Name |"
            echo "|---|---|---|"
            for f in sprites/*.txt; do
              level=$(sed -n 's/^# *level: *//p' "$f" | tr -d '\r')
              name=$(sed -n 's/^# *name: *//p' "$f" | tr -d '\r')
              echo "| $(basename "$f") | $level | $name |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The final gate: runs only after lint, test, and validate-sprites succeed.
  build:
    name: Build production bundle
    needs: [lint, test, validate-sprites]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: 'echo "Validated sprites: ${{ needs.validate-sprites.outputs.sprite-count }}"'
      - run: npm run build
      # Redundant with the default behavior, but makes it explicit that we only
      # publish the artifact after the preceding steps succeed.
      - name: Upload build artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
